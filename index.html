    <style>
      :root {
        --brand-dark: #1F4E79;
        --brand-light: #34C1E5;
        --bg-app: #FDFDFE;
        --f-display: 'Space Grotesk', sans-serif;
        --f-body: 'Inter', sans-serif;
      }
      body {
        font-family: var(--f-body);
        -webkit-tap-highlight-color: transparent;
        background-color: var(--bg-app);
        color: #0F172A;
        overflow-x: hidden;
      }
      .font-display { font-family: var(--f-display); }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glass-dark {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .hero-gradient {
        background: radial-gradient(circle at 0% 0%, #1F4E79 0%, #0F172A 100%);
      }
      .app-card {
        border-radius: 42px;
        background: #FFFFFF;
        border: 1px solid rgba(241, 245, 249, 0.8);
        box-shadow: 0 4px 20px -5px rgba(15, 23, 42, 0.05);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .app-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 30px 60px -15px rgba(31, 78, 121, 0.12);
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--brand-dark) 0%, #2a69a3 100%);
        box-shadow: 0 12px 24px -8px rgba(31, 78, 121, 0.4);
      }
      .text-gradient {
        background: linear-gradient(135deg, #34C1E5 0%, #1F4E79 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .text-glow {
        text-shadow: 0 0 30px rgba(52, 193, 229, 0.3);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-reveal {
        animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .mesh-bg {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: radial-gradient(at 0% 0%, rgba(52, 193, 229, 0.05) 0, transparent 50%), 
                          radial-gradient(at 50% 0%, rgba(31, 78, 121, 0.05) 0, transparent 50%);
        pointer-events: none;
        z-index: -1;
      }
    </style>
